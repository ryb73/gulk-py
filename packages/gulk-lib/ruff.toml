[lint]
select = ["ALL"]
# COM812: would like to enable but incompatible; see https://github.com/astral-sh/ruff/issues/9216
ignore = [
    "ANN201",
    "ANN202",
    "COM812",
    "CPY001",
    "D",
    "PLR2004",
    "S101",
    "TD003",
    "TRY003",
]

[lint.isort]
split-on-trailing-comma = false

[lint.per-file-ignores]
# tests/ is an implicit namespace package by design, per pytest's own
# recommendation for --import-mode=importlib (no __init__.py needed).
"tests/**" = ["INP001"]

[format]
skip-magic-trailing-comma = true
