[project]
name = "gulk-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryan", email = "rpbiwer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
preset = "strict"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "inline-snapshot>=0.35.3",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
