[project]
name = "gulk-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Ryan", email = "rpbiwer@gmail.com" }]
requires-python = ">=3.12"
dependencies = []

[tool.pyrefly]
project-includes = ["**/*.py*", "**/*.ipynb"]
search-path = ["src", "."]
preset = "strict"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "inline-snapshot>=0.35.3",
    "pyrefly>=1.1.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
